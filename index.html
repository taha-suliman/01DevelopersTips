<title>نادي البرمجة | نصيحتك اليوم</title>

<style>
:root{--navy:#0b2545;--blue:#1b7fc4;--sky:#4fb0f0;--yellow:#f9d03a;--ink:#132a45;--soft:#5b6f86;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:Cairo,Tajawal,"Segoe UI",Tahoma,sans-serif;color:#fff;overflow-x:hidden;
background:
radial-gradient(circle at 85% 8%,rgba(249,208,58,.28),transparent 38%),
radial-gradient(circle at 10% 92%,rgba(79,176,240,.35),transparent 42%),
radial-gradient(rgba(255,255,255,.09) 1.4px,transparent 1.6px) 0 0/26px 26px,
linear-gradient(165deg,#081a33 0%,#0f3a6b 55%,#1b7fc4 130%);background-attachment:fixed}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg i{position:absolute;bottom:-80px;left:var(--l);font-style:normal;font-weight:900;font-family:monospace;font-size:var(--s);color:rgba(255,255,255,.11);animation:rise var(--d) linear var(--t) infinite}
.bg i svg{width:var(--s);height:var(--s)}
@keyframes rise{to{transform:translateY(-120vh) rotate(300deg)}}
main{position:relative;z-index:1;width:100%;max-width:560px;margin:0 auto;padding:22px 18px 30px;display:flex;flex-direction:column;align-items:center;gap:22px}
.logos{display:flex;align-items:center;justify-content:center;gap:16px;background:#fff;border-radius:22px;padding:10px 20px;box-shadow:0 10px 30px rgba(0,0,0,.28);animation:drop .8s cubic-bezier(.2,.9,.3,1.2) both}
.logos img{height:52px;max-width:46%;object-fit:contain}
.logos i{width:2px;height:36px;border-radius:2px;background:linear-gradient(var(--blue),var(--yellow))}
@keyframes drop{from{opacity:0;transform:translateY(-30px)}}
.hero{text-align:center}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(8px);padding:6px 16px;border-radius:99px;font-size:.88rem;font-weight:600}
.badge .ic{color:var(--yellow)}
h1{margin:14px 0 8px;font-size:2rem;line-height:1.45;font-weight:900}
h1 span{display:block;font-size:1.05rem;font-weight:600;color:var(--yellow);margin-bottom:2px}
.sub{margin:0 auto;max-width:400px;line-height:1.9;font-size:1rem;color:rgba(255,255,255,.82)}
.bulb{width:74px;height:74px;margin:0 auto 4px;border-radius:50%;display:grid;place-items:center;font-size:2rem;color:var(--navy);background:radial-gradient(circle at 35% 30%,#fff3b0,var(--yellow));box-shadow:0 0 0 8px rgba(249,208,58,.18),0 0 40px rgba(249,208,58,.6);animation:bulb 3s ease-in-out infinite}
@keyframes bulb{50%{box-shadow:0 0 0 14px rgba(249,208,58,.08),0 0 60px rgba(249,208,58,.85)}}
.tip{position:relative;width:100%;background:#fff;color:var(--ink);border-radius:30px;padding:26px 24px 24px;min-height:290px;display:flex;flex-direction:column;gap:16px;box-shadow:0 25px 60px rgba(0,0,0,.4);overflow:hidden}
.tip:before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:linear-gradient(90deg,var(--yellow),var(--sky),var(--blue))}
.tip .q{position:absolute;left:14px;bottom:8px;font-size:7rem;color:rgba(27,127,196,.08);transform:scaleX(-1)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.chip{--c:#1b7fc4;display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;font-weight:700;font-size:.88rem;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff)}
.num{font-size:.8rem;color:var(--soft);font-weight:600}
.body{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;transition:opacity .3s,transform .3s}
.body.out{opacity:0;transform:translateY(14px) scale(.98)}
.pre{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;color:var(--blue);font-weight:900;font-size:1.05rem}
.pre .ic{background:var(--yellow);color:var(--navy);padding:5px;width:28px;height:28px;border-radius:9px}
#tip{margin:0;font-size:1.34rem;line-height:2;font-weight:700}
.btns{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;font-weight:700;border:0;border-radius:18px;padding:15px 12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;font-size:1.02rem;transition:transform .15s,box-shadow .15s}
button:active{transform:translateY(3px) scale(.98)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.main{grid-column:1/-1;background:linear-gradient(180deg,#ffe066,var(--yellow));color:var(--navy);font-size:1.2rem;font-weight:900;padding:18px;box-shadow:0 6px 0 #c99f0b,0 14px 30px rgba(249,208,58,.4);animation:pulse 2.6s ease-in-out infinite}
.main:active{box-shadow:0 2px 0 #c99f0b}
.main .ic{font-size:1.4rem;transition:transform .6s}
.main.spin .ic{transform:rotate(360deg) scale(1.2)}
@keyframes pulse{50%{transform:scale(1.025)}}
.wa{background:#25d366;color:#053b1a;box-shadow:0 5px 0 #17a04b}
.cp{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.4);backdrop-filter:blur(8px)}
.note{display:flex;align-items:center;gap:8px;font-size:.88rem;color:rgba(255,255,255,.75);text-align:center}
footer{margin-top:6px;text-align:center;font-size:.9rem;color:rgba(255,255,255,.8);line-height:1.9}
footer .ic{color:#ff6b81;vertical-align:-2px}
.toast{position:fixed;z-index:9;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#fff;color:var(--navy);padding:12px 22px;border-radius:16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.3s;display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:700px){h1{font-size:2.5rem}#tip{font-size:1.5rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const cats={
  passion:['الشغف والحماس','flame','#d97706'],
  patience:['الصبر والإصرار','clock','#e11d48'],
  learn:['التعلم المستمر','book','#1b7fc4'],
  ai:['الحاسوب والذكاء الاصطناعي','cpu','#7c3aed'],
  future:['المستقبل','trend','#059669'],
  team:['العمل الجماعي','users','#ea580c']
};
const PREFIX='نادي البرمجة بقول ليك';
const $=id=>document.getElementById(id);
const body=$('body'),tipEl=$('tip'),chip=$('chip'),num=$('num'),nextBtn=$('next'),toastEl=$('toast');
let bag=[],last=-1,current='';
$('count').textContent=tips.length;
function refill(){
  bag=tips.map((_,i)=>i);
  for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}
  if(bag[bag.length-1]===last){const k=Math.floor(Math.random()*(bag.length-1));[bag[bag.length-1],bag[k]]=[bag[k],bag[bag.length-1]];}
}
function pick(){
  if(!bag.length)refill();
  let i=bag.pop();
  if(i===last){if(!bag.length)refill();const n=bag.pop();bag.push(i);i=n;}
  last=i;return i;
}
function render(i){
  const t=tips[i],c=cats[t[1]];
  current=t[0];
  tipEl.textContent=current.slice(PREFIX.length).trim();
  chip.style.setProperty('--c',c[2]);
  chip.innerHTML='<svg class="ic"><use href="#'+c[1]+'"/></svg>'+c[0];
  num.textContent='نصيحة '+(i+1)+' من '+tips.length;
  body.classList.remove('out');
}
function show(first){
  const i=pick();
  if(first){render(i);return;}
  body.classList.add('out');
  setTimeout(()=>render(i),300);
}
function toast(msg){
  toastEl.innerHTML='<svg class="ic"><use href="#check"/></svg>'+msg;
  toastEl.classList.add('show');
  clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove('show'),1900);
}
function shareText(){return current+'\n\nنصيحة من نادي البرمجة - #VHO_LinkUp_Event';}
nextBtn.addEventListener('click',()=>{
  nextBtn.classList.add('spin');
  setTimeout(()=>nextBtn.classList.remove('spin'),600);
  show(false);
});
$('wa').addEventListener('click',()=>{
  window.open('https://wa.me/?text='+encodeURIComponent(shareText()),'_blank','noopener');
});
$('cp').addEventListener('click',async()=>{
  const text=shareText();
  try{
    await navigator.clipboard.writeText(text);
    toast('تم نسخ النصيحة');
  }catch(e){
    const t=document.createElement('textarea');
    t.value=text;t.style.position='fixed';t.style.opacity='0';
    document.body.appendChild(t);t.select();
    let ok=false;
    try{ok=document.execCommand('copy');}catch(err){}
    document.body.removeChild(t);
    toast(ok?'تم نسخ النصيحة':'انسخ النص يدوياً');
  }
});
show(true);
